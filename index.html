<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OAuth2 Backend Simulator & Data Viewer</title>
    <style>
        :root { --vk: #0077ff; --mail: #005ff9; --ya: #ffcc00; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.1); }

        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-vk { background: var(--vk); }
        .btn-mail { background: var(--mail); }
        .btn-ya { background: var(--ya); color: black; }

        /* User Card */
        #user-card { display: none; margin-top: 20px; border: 1px solid #ddd; border-radius: 12px; overflow: hidden; }
        .user-header { display: flex; align-items: center; padding: 20px; background: #fafafa; border-bottom: 1px solid #eee; }
        .user-header img { width: 70px; height: 70px; border-radius: 50%; margin-right: 20px; background: #eee; }
        .user-header h3 { margin: 0; }

        /* Console Log */
        #console { background: #1c1e21; color: #a5ff90; padding: 15px; border-radius: 8px; font-family: 'Consolas', monospace; font-size: 12px; height: 250px; overflow-y: auto; margin-top: 20px; line-height: 1.5; }
        .step { color: #00d4ff; font-weight: bold; margin-top: 10px; border-left: 3px solid #00d4ff; padding-left: 10px; }
        .data-label { color: #ffcc00; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 6px; font-size: 12px; overflow-x: auto; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>OAuth2 Backend Simulator</h2>
    <p>Скрипт имитирует логику <b>ExternalAuthServlet</b> и отображает результат.</p>

    <div class="btn-group">
        <button class="btn-vk" onclick="initAuth('vk')">VK ID</button>
        <button class="btn-mail" onclick="initAuth('mail_ru')">Mail.ru</button>
        <button class="btn-ya" onclick="initAuth('yandex')">Yandex</button>
    </div>

    <div id="user-card">
        <div class="user-header">
            <img id="u-avatar" src="" alt="">
            <div>
                <h3 id="u-name">Name</h3>
                <p id="u-id" style="margin:5px 0; color:#666; font-size:14px;"></p>
                <p id="u-email" style="margin:0; font-size:14px;"></p>
            </div>
        </div>
        <div style="padding: 20px;">
            <label style="font-weight:bold; font-size:12px;">RAW USER INFO (JSON):</label>
            <pre id="u-json"></pre>
        </div>
    </div>

    <div id="console">Готов к имитации...</div>
</div>

<script>
    // КОНФИГУРАЦИЯ (как в вашем application.yaml)
    const CONFIG = {
        vk: { cid: "54421608" },
        yandex: { cid: "a3624cdac0b24aff84bbebe83cbce9a1", secret: "7a8c08ce79db45658443307c8d3ee24f" },
        redirectUri: window.location.origin + window.location.pathname
    };

    const logEl = document.getElementById('console');
    function log(msg, isStep = false) {
        const div = document.createElement('div');
        if (isStep) div.className = 'step';
        div.innerHTML = msg;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
    }

    // --- ИМИТАЦИЯ SecurityUtils ---
    async function generatePKCE() {
        const verifier = Array.from(crypto.getRandomValues(new Uint8Array(64)))
            .map(b => "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"[b % 62]).join('');
        const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
        const challenge = btoa(String.fromCharCode(...new Uint8Array(hash)))
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        return { verifier, challenge };
    }

    // --- ШАГ 1: handleInit (Бэкенд генерирует URL) ---
    async function initAuth(provider) {
        log(`ШАГ 1: handleInit (${provider})`, true);
        const pkce = await generatePKCE();
        const state = Math.random().toString(36).substring(2, 15);
        const deviceId = crypto.randomUUID(); // Генерируем UUID как в вашем Java-коде

        // Сохраняем "в БД" (sessionStorage)
        const session = { provider, verifier: pkce.verifier, state, deviceId };
        sessionStorage.setItem('auth_db_session', JSON.stringify(session));

        log(`<span class="data-label">Generated Verifier:</span> ${pkce.verifier.substring(0, 15)}...`);
        log(`<span class="data-label">Generated DeviceID:</span> ${deviceId}`);

        let url = "";
        if (provider === 'vk' || provider === 'mail_ru') {
            url = `https://id.vk.com/authorize?response_type=code&client_id=${CONFIG.vk.cid}&redirect_uri=${encodeURIComponent(CONFIG.redirectUri)}&state=${state}&code_challenge=${pkce.challenge}&code_challenge_method=s256&scope=phone email vkid.personal_info&provider=${provider === 'vk' ? 'vkid' : 'mail_ru'}`;
        } else {
            url = `https://oauth.yandex.ru/authorize?response_type=code&client_id=${CONFIG.yandex.cid}&redirect_uri=${encodeURIComponent(CONFIG.redirectUri)}&state=${state}&code_challenge=${pkce.challenge}&code_challenge_method=S256&device_id=${deviceId}`;
        }

        log(`Редирект на: <small>${url}</small>`);
        setTimeout(() => window.location.href = url, 1000);
    }

    // --- ШАГ 2: handleExchange (Бэкенд меняет код на данные) ---
    async function processCallback() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const session = JSON.parse(sessionStorage.getItem('auth_db_session'));

        if (!code || !session || state !== session.state) return;

        log(`ШАГ 2: handleExchange (${session.provider})`, true);
        window.history.replaceState({}, document.title, window.location.pathname);

        // ЛОГИКА DEVICE_ID СОГЛАСНО ВАШЕМУ ТРЕБОВАНИЮ:
        let deviceIdToUse = session.deviceId; // По умолчанию из сессии (для Яндекс)
        const deviceIdFromRedirect = params.get('device_id');

        if ((session.provider === 'vk' || session.provider === 'mail_ru') && deviceIdFromRedirect) {
            deviceIdToUse = deviceIdFromRedirect;
            log(`<span class="data-label">DeviceID:</span> Взято из REDIRECT URL (как просили для VK) -> ${deviceIdToUse}`);
        } else {
            log(`<span class="data-label">DeviceID:</span> Взято из SESSION DB (как просили для Yandex) -> ${deviceIdToUse}`);
        }

        try {
            log(`Запрос токена (имитация POST запроса бэкенда)...`);
            let userResult;

            if (session.provider === 'vk' || session.provider === 'mail_ru') {
                // Имитация VkAuthProvider.exchangeCode
                const tokenRes = await fetch('https://id.vk.com/oauth2/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        grant_type: 'authorization_code', code, code_verifier: session.verifier,
                        client_id: CONFIG.vk.cid, device_id: deviceIdToUse, redirect_uri: CONFIG.redirectUri,
                        provider: session.provider === 'vk' ? 'vkid' : 'mail_ru'
                    })
                });
                const tokenData = await tokenRes.json();

                log(`Токен получен. Запрос UserInfo...`);
                const infoRes = await fetch('https://id.vk.com/oauth2/user_info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ access_token: tokenData.access_token, client_id: CONFIG.vk.cid })
                });
                userResult = await infoRes.json();
                displayUser(userResult, 'vk');
            } else {
                // Имитация YandexAuthProvider.exchangeCode
                const tokenRes = await fetch('https://oauth.yandex.ru/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        grant_type: 'authorization_code', code, code_verifier: session.verifier,
                        client_id: CONFIG.yandex.cid, client_secret: CONFIG.yandex.secret, device_id: deviceIdToUse
                    })
                });
                const tokenData = await tokenRes.json();

                log(`Токен получен. Запрос UserInfo...`);
                const infoRes = await fetch('https://login.yandex.ru/info?format=json', {
                    headers: { 'Authorization': `OAuth ${tokenData.access_token}` }
                });
                userResult = await infoRes.json();
                displayUser(userResult, 'yandex');
            }
        } catch (e) {
            log(`ОШИБКА CORS: Провайдеры блокируют запросы с фронтенда. <br>Это доказывает, что этот код ДОЛЖЕН работать на Java-бэкенде.`, true);
            console.error(e);
        }
    }

    // --- ВИЗУАЛИЗАЦИЯ ДАННЫХ ---
    function displayUser(data, provider) {
        document.getElementById('user-card').style.display = 'block';
        const card = document.getElementById('user-card');

        if (provider === 'vk') {
            const u = data.user;
            document.getElementById('u-avatar').src = u.avatar;
            document.getElementById('u-name').innerText = `${u.first_name} ${u.last_name}`;
            document.getElementById('u-id').innerText = `VK ID: ${u.user_id}`;
            document.getElementById('u-email').innerText = u.email || "Email скрыт";
        } else {
            const u = data;
            document.getElementById('u-avatar').src = `https://avatars.yandex.net/get-yapic/${u.default_avatar_id}/islands-200`;
            document.getElementById('u-name').innerText = u.real_name || u.display_name;
            document.getElementById('u-id').innerText = `Yandex ID: ${u.id}`;
            document.getElementById('u-email').innerText = u.default_email || "Email скрыт";
        }

        document.getElementById('u-json').innerText = JSON.stringify(data, null, 2);
        log("ДАННЫЕ ПОЛУЧЕНЫ УСПЕШНО", true);
    }

    window.onload = processCallback;
</script>

</body>
</html>
